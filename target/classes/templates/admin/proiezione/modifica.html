<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Modifica proiezione')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container" style="max-width: 600px;">
	<h2 class="mb-1">Modifica proiezione</h2>
	<p class="text-muted" th:text="${proiezione.film.titolo} + ' - ' + ${proiezione.sala.nome}">Film - Sala</p>

	<form th:action="@{/admin/proiezioni/{id}(id=${proiezione.id})}" method="post">
		<input type="hidden" name="festivalId" th:value="${proiezione.festival.id}">

		<div class="mb-3">
			<label class="form-label">Stato</label>
			<select name="stato" class="form-select" required>
				<option th:each="s : ${stati}" th:value="${s}" th:text="${s}"
				        th:selected="${s == proiezione.stato}">Stato</option>
			</select>
		</div>
		<div class="row mb-3">
			<div class="col">
				<label class="form-label">Data</label>
				<input type="date" name="data" class="form-control" th:value="${proiezione.data}" required>
			</div>
			<div class="col">
				<label class="form-label">Ora</label>
				<input type="time" name="ora" class="form-control" th:value="${proiezione.ora}" required>
			</div>
		</div>

		<button type="submit" class="btn btn-primary">Salva</button>
		<a th:href="@{/festival/{id}(id=${proiezione.festival.id})}" class="btn btn-outline-secondary">Annulla</a>
	</form>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
