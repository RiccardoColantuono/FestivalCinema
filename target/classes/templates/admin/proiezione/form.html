<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Nuova proiezione')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container" style="max-width: 600px;">
	<h2 class="mb-1">Nuova proiezione</h2>
	<p class="text-muted" th:text="${festival.nome}">Festival</p>

	<div class="alert alert-warning" th:if="${#lists.isEmpty(filmDisponibili)}">
		Nessun film e' ancora associato a questo festival: aggiungine uno prima di programmare una proiezione.
	</div>

	<form th:if="${!#lists.isEmpty(filmDisponibili)}" th:action="@{/admin/proiezioni}" method="post">
		<input type="hidden" name="festivalId" th:value="${festival.id}">

		<div class="mb-3">
			<label class="form-label">Film</label>
			<select name="filmId" class="form-select" required>
				<option value="">-- seleziona un film --</option>
				<option th:each="f : ${filmDisponibili}" th:value="${f.id}" th:text="${f.titolo}">Film</option>
			</select>
		</div>
		<div class="mb-3">
			<label class="form-label">Sala</label>
			<select name="salaId" class="form-select" required>
				<option value="">-- seleziona una sala --</option>
				<option th:each="s : ${sale}" th:value="${s.id}" th:text="${s.nome} + ' (' + ${s.capienza} + ' posti)'">Sala</option>
			</select>
		</div>
		<div class="row mb-3">
			<div class="col">
				<label class="form-label">Data</label>
				<input type="date" name="data" class="form-control" required>
			</div>
			<div class="col">
				<label class="form-label">Ora</label>
				<input type="time" name="ora" class="form-control" required>
			</div>
		</div>

		<button type="submit" class="btn btn-primary">Programma</button>
		<a th:href="@{/festival/{id}(id=${festival.id})}" class="btn btn-outline-secondary">Annulla</a>
	</form>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
