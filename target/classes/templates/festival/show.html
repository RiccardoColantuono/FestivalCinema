<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head(${festival.nome})}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container">
	<div class="d-flex justify-content-between align-items-start mb-3">
		<div>
			<h1 th:text="${festival.nome}">Nome festival</h1>
			<p class="text-muted" th:text="${festival.citta} + ' - ' + ${festival.dataInizio} + ' → ' + ${festival.dataFine}">
				Citta e date
			</p>
			<p th:text="${festival.descrizione}">Descrizione</p>
		</div>
		<a sec:authorize="hasAuthority('ADMIN')" class="btn btn-outline-secondary"
		   th:href="@{/admin/festival/{id}/modifica(id=${festival.id})}">Modifica</a>
	</div>

	<h3 class="mt-4">Film in programma</h3>
	<div class="alert alert-light border" th:if="${#lists.isEmpty(festival.film)}">
		Nessun film ancora associato a questo festival.
	</div>
	<div class="row row-cols-1 row-cols-md-3 g-3 mb-4">
		<div class="col" th:each="film : ${festival.film}">
			<div class="card h-100">
				<div class="card-body">
					<h6 class="card-title" th:text="${film.titolo}">Titolo</h6>
					<p class="card-text small text-muted"
					   th:text="${film.anno} + ' • ' + ${film.genere} + ' • ' + ${film.durata} + ' min'">
						Dettagli
					</p>
					<a th:href="@{/film/{id}(id=${film.id})}" class="btn btn-sm btn-outline-primary">Dettagli film</a>
				</div>
			</div>
		</div>
	</div>

	<h3 class="mt-4">Programma delle proiezioni</h3>
	<div class="alert alert-light border" th:if="${#lists.isEmpty(proiezioni)}">
		Nessuna proiezione ancora programmata.
	</div>
	<table class="table table-striped" th:if="${!#lists.isEmpty(proiezioni)}">
		<thead>
			<tr>
				<th>Data</th>
				<th>Ora</th>
				<th>Film</th>
				<th>Sala</th>
				<th>Stato</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="p : ${proiezioni}">
				<td th:text="${p.data}">Data</td>
				<td th:text="${p.ora}">Ora</td>
				<td th:text="${p.film.titolo}">Film</td>
				<td th:text="${p.sala.nome}">Sala</td>
				<td th:text="${p.stato}">Stato</td>
			</tr>
		</tbody>
	</table>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
