<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Sale')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<h2>Sale</h2>
		<a class="btn btn-success" th:href="@{/admin/sale/nuova}">+ Nuova sala</a>
	</div>

	<div class="alert alert-info" th:if="${#lists.isEmpty(sale)}">Nessuna sala presente.</div>

	<table class="table table-striped" th:if="${!#lists.isEmpty(sale)}">
		<thead>
			<tr>
				<th>Nome</th>
				<th>Indirizzo</th>
				<th>Capienza</th>
				<th></th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="s : ${sale}">
				<td th:text="${s.nome}">Nome</td>
				<td th:text="${s.indirizzo}">Indirizzo</td>
				<td th:text="${s.capienza}">Capienza</td>
				<td class="text-end">
					<a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/sale/{id}/modifica(id=${s.id})}">Modifica</a>
					<form class="d-inline" th:action="@{/admin/sale/{id}/elimina(id=${s.id})}" method="post">
						<button type="submit" class="btn btn-sm btn-outline-danger">Elimina</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
