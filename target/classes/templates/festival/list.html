<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Festival')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<h2 class="mb-0">🎪 Festival cinematografici</h2>
		<a sec:authorize="hasAuthority('ADMIN')" class="btn btn-success" th:href="@{/admin/festival/nuovo}">
			+ Nuovo festival
		</a>
	</div>

	<!-- Ricerca e filtri (Sezione 9) -->
	<form class="row g-2 mb-4" method="get" th:action="@{/festival}">
		<div class="col-md-4">
			<input type="text" name="nome" class="form-control" placeholder="Cerca per nome" th:value="${nome}">
		</div>
		<div class="col-md-3">
			<input type="text" name="citta" class="form-control" placeholder="Citta'" th:value="${citta}">
		</div>
		<div class="col-md-3">
			<input type="number" name="anno" class="form-control" placeholder="Anno" th:value="${anno}">
		</div>
		<div class="col-md-2">
			<button type="submit" class="btn btn-primary w-100">Cerca</button>
		</div>
	</form>

	<div class="alert alert-info" th:if="${festivalPage.empty}">
		Nessun festival trovato.
	</div>

	<div class="row row-cols-1 row-cols-md-2 g-4 mb-4">
		<div class="col" th:each="f : ${festivalPage.content}">
			<div class="card h-100">
				<img th:if="${f.immagineCopertina}" th:src="@{'/uploads/' + ${f.immagineCopertina}}" class="card-img-top"
				     style="height: 180px; object-fit: cover;" alt="Immagine festival">
				<div class="card-body">
					<h5 class="card-title" th:text="${f.nome}">Nome festival</h5>
					<h6 class="card-subtitle mb-2 text-muted"
						th:text="${f.citta} + ' - ' + ${f.anno}">Citta - Anno</h6>
					<p class="card-text" th:text="${f.dataInizio} + ' → ' + ${f.dataFine}">Date</p>
					<a th:href="@{/festival/{id}(id=${f.id})}" class="btn btn-outline-primary">Dettagli</a>
				</div>
			</div>
		</div>
	</div>

	<!-- Paginazione -->
	<nav th:if="${festivalPage.totalPages > 1}" aria-label="Paginazione festival">
		<ul class="pagination justify-content-center">
			<li class="page-item" th:classappend="${festivalPage.first} ? 'disabled'">
				<a class="page-link"
				   th:href="@{/festival(nome=${nome},anno=${anno},citta=${citta},page=${festivalPage.number - 1})}">Precedente</a>
			</li>
			<li class="page-item" th:each="i : ${#numbers.sequence(0, festivalPage.totalPages - 1)}"
			    th:classappend="${i == festivalPage.number} ? 'active'">
				<a class="page-link"
				   th:href="@{/festival(nome=${nome},anno=${anno},citta=${citta},page=${i})}" th:text="${i + 1}">1</a>
			</li>
			<li class="page-item" th:classappend="${festivalPage.last} ? 'disabled'">
				<a class="page-link"
				   th:href="@{/festival(nome=${nome},anno=${anno},citta=${citta},page=${festivalPage.number + 1})}">Successiva</a>
			</li>
		</ul>
	</nav>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
