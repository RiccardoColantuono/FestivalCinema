<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(${festival.id} == null ? 'Nuovo festival' : 'Modifica festival')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container" style="max-width: 600px;">
	<h2 class="mb-4" th:text="${festival.id} == null ? 'Nuovo festival' : 'Modifica festival'">Festival</h2>

	<form th:action="${festival.id} == null ? @{/admin/festival} : @{/admin/festival/{id}(id=${festival.id})}"
	      th:object="${festival}" method="post">

		<div class="mb-3">
			<label class="form-label">Nome</label>
			<input type="text" th:field="*{nome}" class="form-control" required>
		</div>
		<div class="mb-3">
			<label class="form-label">Anno</label>
			<input type="number" th:field="*{anno}" class="form-control" required>
		</div>
		<div class="mb-3">
			<label class="form-label">Citta'</label>
			<input type="text" th:field="*{citta}" class="form-control">
		</div>
		<div class="row mb-3">
			<div class="col">
				<label class="form-label">Data inizio</label>
				<input type="date" th:field="*{dataInizio}" class="form-control" required>
			</div>
			<div class="col">
				<label class="form-label">Data fine</label>
				<input type="date" th:field="*{dataFine}" class="form-control" required>
			</div>
		</div>
		<div class="mb-3">
			<label class="form-label">Descrizione</label>
			<textarea th:field="*{descrizione}" class="form-control" rows="4"></textarea>
		</div>

		<button type="submit" class="btn btn-primary">Salva</button>
		<a th:href="@{/festival}" class="btn btn-outline-secondary">Annulla</a>
	</form>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
