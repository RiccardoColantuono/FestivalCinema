<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Registi')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<h2>Registi</h2>
		<a class="btn btn-success" th:href="@{/admin/registi/nuovo}">+ Nuovo regista</a>
	</div>

	<div class="alert alert-info" th:if="${#lists.isEmpty(registi)}">Nessun regista presente.</div>

	<table class="table table-striped" th:if="${!#lists.isEmpty(registi)}">
		<thead>
			<tr>
				<th>Nome</th>
				<th>Cognome</th>
				<th>Nazionalita'</th>
				<th>Data di nascita</th>
				<th></th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="r : ${registi}">
				<td th:text="${r.nome}">Nome</td>
				<td th:text="${r.cognome}">Cognome</td>
				<td th:text="${r.nazionalita}">Nazionalita'</td>
				<td th:text="${r.dataNascita}">Data</td>
				<td class="text-end">
					<a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/registi/{id}/modifica(id=${r.id})}">Modifica</a>
					<form class="d-inline" th:action="@{/admin/registi/{id}/elimina(id=${r.id})}" method="post">
						<button type="submit" class="btn btn-sm btn-outline-danger">Elimina</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
