<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titolo)">
	<meta charset="UTF-8">
	<title th:text="${titolo} + ' - Festival Cinema'">Festival Cinema</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		/* Un colore per categoria di navigazione (Sezione UI: rendere il sito
		   piu' accogliente con colori + emoji accanto alle categorie). */
		.nav-link.cat-festival { color: #e9b8ff; }
		.nav-link.cat-film { color: #8ecbff; }
		.nav-link.cat-proiezioni { color: #ffc182; }
		.nav-link.cat-statistiche { color: #8de6b0; }
		.nav-link.cat-admin { color: #ffb3b3; }
		.nav-link.cat-festival:hover, .nav-link.cat-film:hover, .nav-link.cat-proiezioni:hover,
		.nav-link.cat-statistiche:hover, .nav-link.cat-admin:hover { filter: brightness(1.25); }

		/* Badge genere film: stesso stile per tutti, l'emoji da' la varieta' */
		.badge-genere {
			display: inline-flex;
			align-items: center;
			gap: 0.3em;
			background: #fff3cd;
			color: #664d03;
			border-radius: 999px;
			padding: 0.15rem 0.65rem;
			font-size: 0.8rem;
			font-weight: 600;
		}

		/* Badge stato proiezione */
		.badge-stato { border-radius: 999px; padding: 0.2rem 0.6rem; font-size: 0.8rem; font-weight: 600; }
		.badge-stato-SCHEDULED { background: #cfe2ff; color: #084298; }
		.badge-stato-COMPLETED { background: #d1e7dd; color: #0f5132; }
		.badge-stato-CANCELLED { background: #f8d7da; color: #842029; }
	</style>
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
	<div class="container">
		<a class="navbar-brand" th:href="@{/}">🎬 Festival Cinema</a>
		<div class="navbar-nav me-auto">
			<a class="nav-link cat-festival" th:href="@{/festival}">🎪 Festival</a>
			<a class="nav-link cat-film" th:href="@{/film}">🎬 Film</a>
			<a class="nav-link cat-proiezioni" th:href="@{/proiezioni}">🕒 Proiezioni</a>
			<a class="nav-link cat-statistiche" th:href="@{/statistiche}">📊 Statistiche</a>
			<a class="nav-link cat-admin" sec:authorize="hasAuthority('ADMIN')" th:href="@{/admin/registi}">🎭 Registi</a>
			<a class="nav-link cat-admin" sec:authorize="hasAuthority('ADMIN')" th:href="@{/admin/sale}">🏛️ Sale</a>
		</div>
		<div class="navbar-nav">
			<span class="navbar-text text-light me-3" sec:authorize="isAuthenticated()">
				Ciao, <span sec:authentication="name">utente</span>
			</span>
			<a class="nav-link" sec:authorize="isAnonymous()" th:href="@{/login}">Accedi</a>
			<a class="nav-link" sec:authorize="isAnonymous()" th:href="@{/register}">Registrati</a>
			<form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline">
				<button type="submit" class="btn btn-outline-light btn-sm">Esci</button>
			</form>
		</div>
	</div>
</nav>

<footer th:fragment="footer"></footer>

<!-- Badge del genere: stesso stile per tutti i generi, l'emoji da' la varieta'.
     Il chiamante deve gia' verificare che genere non sia nullo (th:if a monte). -->
<span th:fragment="badgeGenere(genere)" class="badge-genere" th:switch="${genere}">
	<span th:case="'Animazione'">🎨</span>
	<span th:case="'Fantascienza'">🚀</span>
	<span th:case="'Drammatico'">🎭</span>
	<span th:case="'Thriller'">🔪</span>
	<span th:case="'Commedia'">😂</span>
	<span th:case="'Horror'">👻</span>
	<span th:case="'Documentario'">🎥</span>
	<span th:case="'Azione'">💥</span>
	<span th:case="'Romantico'">❤️</span>
	<span th:case="'Biografico'">📖</span>
	<span th:case="'Musical'">🎵</span>
	<span th:case="'Fantasy'">🧙</span>
	<span th:case="'Avventura'">🗺️</span>
	<span th:case="*">🎞️</span>
	<span th:text="${genere}">Genere</span>
</span>

<!-- Badge dello stato di una proiezione -->
<span th:fragment="badgeStato(stato)" class="badge-stato" th:classappend="'badge-stato-' + ${stato}"
      th:switch="${stato}">
	<span th:case="'SCHEDULED'">🟢 Programmata</span>
	<span th:case="'COMPLETED'">✅ Conclusa</span>
	<span th:case="'CANCELLED'">❌ Annullata</span>
	<span th:case="*" th:text="${stato}">Stato</span>
</span>

</body>
</html>
