<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(${sala.id} == null ? 'Nuova sala' : 'Modifica sala')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container" style="max-width: 600px;">
	<h2 class="mb-4" th:text="${sala.id} == null ? 'Nuova sala' : 'Modifica sala'">Sala</h2>

	<form th:action="${sala.id} == null ? @{/admin/sale} : @{/admin/sale/{id}(id=${sala.id})}"
	      th:object="${sala}" method="post">

		<div class="mb-3">
			<label class="form-label">Nome</label>
			<input type="text" th:field="*{nome}" class="form-control" required>
		</div>
		<div class="mb-3">
			<label class="form-label">Indirizzo</label>
			<input type="text" th:field="*{indirizzo}" class="form-control">
		</div>
		<div class="mb-3">
			<label class="form-label">Capienza</label>
			<input type="number" th:field="*{capienza}" class="form-control" required>
		</div>

		<button type="submit" class="btn btn-primary">Salva</button>
		<a th:href="@{/admin/sale}" class="btn btn-outline-secondary">Annulla</a>
	</form>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
